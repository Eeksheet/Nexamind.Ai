# LLM provider / model registry. Prices are USD per 1M tokens and are *estimates*
# (public list prices at time of writing); they are only used to compute the
# "estimated cost" column, which is always labelled as an estimate.
providers:
  mock:
    env_key: null
    models:
      mock-extractive: {input_per_m: 0.0, output_per_m: 0.0}
  anthropic:
    env_key: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1/messages
    models:
      claude-sonnet-4-5: {input_per_m: 3.0, output_per_m: 15.0}
      claude-haiku-4-5: {input_per_m: 1.0, output_per_m: 5.0}
      claude-opus-4-1: {input_per_m: 15.0, output_per_m: 75.0}
  openai:
    env_key: OPENAI_API_KEY
    base_url: https://api.openai.com/v1/chat/completions
    models:
      gpt-4o-mini: {input_per_m: 0.15, output_per_m: 0.60}
      gpt-4o: {input_per_m: 2.50, output_per_m: 10.00}
      gpt-4.1-mini: {input_per_m: 0.40, output_per_m: 1.60}

embedding_models:
  - sentence-transformers/all-MiniLM-L6-v2      # 22M params, CPU friendly (default)
  - BAAI/bge-small-en-v1.5                       # 33M params
  - intfloat/e5-small-v2                         # 33M params
  - BAAI/bge-base-en-v1.5                        # 110M params

reranker_models:
  - cross-encoder/ms-marco-MiniLM-L-6-v2
  - BAAI/bge-reranker-base
