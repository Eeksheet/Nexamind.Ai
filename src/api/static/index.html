<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexamind.Ai — Think. Search. Understand.</title>
<meta name="description" content="Nexamind.Ai — an intelligent AI assistant for answers, research and the web.">
<meta name="application-name" content="Nexamind.Ai">
<meta name="x-research-foundation" content="Multi-Agent RAG">
<style>
:root{--bg:#f7f8fc;--panel:#fff;--panel2:#f1f3f8;--text:#171923;--muted:#697080;--line:#e4e7ee;--accent:#635bff;--accent2:#8b5cf6;--user:#171923;--shadow:0 18px 55px rgba(20,25,40,.08)}
[data-theme=dark]{--bg:#0b0d12;--panel:#11141b;--panel2:#191d27;--text:#f4f5f7;--muted:#9aa2b2;--line:#292e39;--user:#242936;--shadow:0 18px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,textarea{font:inherit}button{cursor:pointer;border:0}.app{height:100%;display:flex;overflow:hidden}.sidebar{width:275px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px;transition:.25s}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;margin:4px 6px 22px}.logo{width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 8px 24px rgba(99,91,255,.3)}.new{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;text-align:left;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.03)}.new:hover{border-color:var(--accent)}.section{font-size:12px;color:var(--muted);font-weight:700;margin:24px 7px 9px;text-transform:uppercase;letter-spacing:.08em}.chats{overflow:auto}.chat-item{padding:10px 11px;border-radius:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}.chat-item:hover{background:var(--panel2);color:var(--text)}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.setting{display:flex;align-items:center;justify-content:space-between;padding:10px 7px;color:var(--muted);font-size:14px}.switch{width:42px;height:24px;border-radius:99px;background:var(--panel2);position:relative}.switch i{position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:var(--muted);transition:.2s}.switch.on{background:var(--accent)}.switch.on i{left:21px;background:#fff}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between;background:color-mix(in srgb,var(--panel) 85%,transparent)}.mobile-menu{display:none;background:none;color:var(--text);font-size:22px}.status{font-size:12px;color:var(--muted)}.content{flex:1;overflow:auto}.welcome{max-width:920px;margin:0 auto;padding:9vh 24px 80px}.hero{text-align:center;margin-bottom:34px}.hero h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.055em;margin:0 0 12px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;color:transparent}.hero p{font-size:17px;color:var(--muted);margin:0}.prompt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.prompt{padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:16px;color:var(--text);text-align:left;box-shadow:var(--shadow);transition:.2s}.prompt:hover{transform:translateY(-2px);border-color:var(--accent)}.prompt small{display:block;color:var(--muted);margin-top:5px}.messages{max-width:900px;margin:0 auto;padding:30px 24px 130px}.msg{display:flex;gap:12px;margin:24px 0}.avatar{flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800}.user .avatar{background:var(--user);color:white}.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.bubble{max-width:calc(100% - 50px);line-height:1.65;font-size:15px}.user .bubble{background:var(--user);color:white;padding:11px 15px;border-radius:15px 15px 4px 15px;margin-left:auto}.assistant .bubble{padding-top:2px}.answer h1,.answer h2,.answer h3{line-height:1.25;margin:18px 0 8px}.answer p{margin:8px 0}.answer ul,.answer ol{padding-left:24px}.answer code{background:var(--panel2);padding:2px 6px;border-radius:5px}.answer pre{background:#10131a;color:#e7eaf0;padding:15px;border-radius:12px;overflow:auto}.actions{display:flex;gap:8px;margin-top:9px}.mini{background:var(--panel2);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:12px}.sources{margin-top:15px;display:flex;gap:10px;overflow:auto;padding-bottom:4px}.source{min-width:210px;max-width:270px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-decoration:none;color:var(--text)}.source b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source span{display:block;color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composer-wrap{position:fixed;bottom:0;left:275px;right:0;padding:18px 24px 22px;background:linear-gradient(transparent,var(--bg) 30%)}.composer{max-width:900px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);padding:9px;display:flex;align-items:flex-end;gap:8px}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:11px 10px;max-height:160px;min-height:45px}.send{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:18px}.send:disabled{opacity:.45}.thinking{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}.dots span{display:inline-block;width:5px;height:5px;background:var(--muted);border-radius:50%;margin:0 2px;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-3px);opacity:.4}}.error{border:1px solid #efb3b3;background:color-mix(in srgb,#ef4444 8%,var(--panel));padding:13px;border-radius:12px;color:#b42318}.route{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:760px){.sidebar{position:fixed;z-index:5;left:-290px;top:0;bottom:0}.sidebar.open{left:0}.mobile-menu{display:block}.topbar{padding:0 14px}.composer-wrap{left:0;padding:12px}.prompt-grid{grid-template-columns:1fr}.welcome{padding-top:7vh}.messages{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">N</div><span>Nexamind.Ai</span></div>
  <button class="new" onclick="newChat()">＋ &nbsp; New chat</button>
  <div class="section">Recent chats</div>
  <div class="chats" id="chats"></div>
  <div style="display:none" aria-hidden="true">Multi-Agent RAG research foundation</div><div class="sidebar-bottom">
    <div class="setting"><span>Dark mode</span><button class="switch" id="themeSwitch" onclick="toggleTheme()"><i></i></button></div>
    <div class="setting"><span>Web search</span><button class="switch on" id="webSwitch" onclick="toggleWeb()"><i></i></button></div>
    <div class="setting"><span>Knowledge base</span><button class="switch on" id="ragSwitch" onclick="toggleRag()"><i></i></button></div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><div class="status" id="status">Ready to help</div><div class="status">Think. Search. Understand.</div></header>
  <div class="content" id="content">
    <section class="welcome" id="welcome">
      <div class="hero"><h1>Nexamind.Ai</h1><p>Your intelligent AI assistant for answers, research, and the web.</p></div>
      <div class="prompt-grid">
        <button class="prompt" onclick="usePrompt('Explain quantum computing in simple words')">Explain quantum computing <small>Learn a complex topic simply</small></button>
        <button class="prompt" onclick="usePrompt('What are the latest AI developments?')">Latest AI developments <small>Search the web for recent information</small></button>
        <button class="prompt" onclick="usePrompt('What is retrieval-augmented generation?')">What is RAG? <small>Get a clear technical explanation</small></button>
        <button class="prompt" onclick="usePrompt('Help me understand how multi-agent AI systems work')">Multi-agent AI <small>Explore an AI research concept</small></button>
      </div>
    </section>
    <section class="messages" id="messages" hidden></section>
  </div>
</main>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Ask Nexamind.Ai anything..." maxlength="12000"></textarea><button class="send" id="send" type="submit">➤</button></form></div>
</div>
<script>
let conversationId=null, webEnabled=true, ragEnabled=true;
const $=id=>document.getElementById(id);
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function markdown(s){let x=escapeHtml(s);x=x.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');x=x.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');x=x.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>');x=x.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+x+'</p>';}
function addMessage(role,text,sources=[],route=''){const m=$('messages');m.hidden=false;$('welcome').hidden=true;const el=document.createElement('div');el.className='msg '+role;let src='';if(sources.length){src='<div class="sources">'+sources.map(s=>`<a class="source" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer"><b>${escapeHtml(s.title)}</b><span>${escapeHtml(s.domain)}</span><span>${escapeHtml(s.snippet||'Open source →')}</span></a>`).join('')+'</div>';}el.innerHTML=`<div class="avatar">${role==='user'?'You':'N'}</div><div class="bubble">${role==='assistant'?'<div class="answer">'+markdown(text)+'</div>':'<div>'+escapeHtml(text)+'</div>'}${src}${role==='assistant'?`<div class="route">${route?route+' · ':''}Nexamind.Ai</div><div class="actions"><button class="mini" onclick="copyText(this)">Copy</button></div>`:''}</div>`;m.appendChild(el);$('content').scrollTop=$('content').scrollHeight;return el;}
function thinking(){const m=$('messages');const el=document.createElement('div');el.className='msg assistant';el.id='thinking';el.innerHTML='<div class="avatar">N</div><div class="bubble"><div class="thinking">Nexamind.Ai <span class="dots"><span></span><span></span><span></span></span></div></div>';m.appendChild(el);$('content').scrollTop=$('content').scrollHeight;}
async function sendMessage(text){text=text.trim();if(!text)return;addMessage('user',text);$('input').value='';resize();$('send').disabled=true;$('status').textContent='Working…';thinking();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversation_id:conversationId,web_enabled:webEnabled,rag_enabled:ragEnabled})});const data=await r.json();$('thinking')?.remove();if(!r.ok||data.error){addMessage('assistant',data.error||'Something went wrong. Please try again.');}else{conversationId=data.conversation_id;addMessage('assistant',data.answer||'I could not generate an answer.',data.sources||[],data.route||'');refreshChats();}$('status').textContent='Ready to help';}catch(e){$('thinking')?.remove();addMessage('assistant','Nexamind.Ai could not reach the server. Please make sure the application is running.');$('status').textContent='Connection issue';}finally{$('send').disabled=false;$('input').focus();}}
$('form').addEventListener('submit',e=>{e.preventDefault();sendMessage($('input').value)});$('input').addEventListener('input',resize);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit();}});function resize(){const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';}function usePrompt(x){$('input').value=x;sendMessage(x)}function newChat(){conversationId=null;$('messages').innerHTML='';$('messages').hidden=true;$('welcome').hidden=false;$('status').textContent='Ready to help';toggleSidebar(false)}function toggleSidebar(force){const s=$('sidebar');s.classList.toggle('open',force===undefined?!s.classList.contains('open'):force)}function toggleTheme(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.theme=dark?'dark':'light';$('themeSwitch').classList.toggle('on',dark)}function toggleWeb(){webEnabled=!webEnabled;$('webSwitch').classList.toggle('on',webEnabled)}function toggleRag(){ragEnabled=!ragEnabled;$('ragSwitch').classList.toggle('on',ragEnabled)}async function refreshChats(){try{const r=await fetch('/api/chats');const data=await r.json();$('chats').innerHTML=data.map(c=>`<button class="chat-item" title="${escapeHtml(c.title)}" onclick="loadChat('${c.id}')">${escapeHtml(c.title)}</button>`).join('')}catch(e){}} async function loadChat(id){try{const r=await fetch('/api/chats/'+encodeURIComponent(id));const c=await r.json();conversationId=c.id;$('messages').innerHTML='';$('messages').hidden=false;$('welcome').hidden=true;(c.messages||[]).forEach(m=>addMessage(m.role==='user'?'user':'assistant',m.content));toggleSidebar(false)}catch(e){}}function copyText(btn){const answer=btn.closest('.bubble').querySelector('.answer')?.innerText||'';navigator.clipboard?.writeText(answer);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)}if(localStorage.theme==='dark')toggleTheme();refreshChats();
</script>
</body>
</html>
