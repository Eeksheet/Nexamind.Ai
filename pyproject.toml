[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexamind-ai"
version = "0.1.0"
description = "Nexamind.Ai — general AI assistant with web search and retrieval-augmented generation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: downloads models (deselect with -m 'not slow')", "real_data: needs data/raw HotpotQA"]
